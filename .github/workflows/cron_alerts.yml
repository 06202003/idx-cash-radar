name: IDX Alert Bot Scheduled Alerts (WIB)

on:
  schedule:
    # 08:45 WIB (01:45 UTC) Mon-Fri
    - cron: "45 1 * * 1-5"
    # 18:00 WIB (11:00 UTC) Mon-Fri
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  trigger-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Morning or Evening Alert on Vercel
        env:
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BOT_BASE_URL" ]; then
            echo "BOT_BASE_URL secret is not set; skipping."
            exit 0
          fi
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" -lt 6 ]; then
            ENDPOINT="/api/cron/morning"
          else
            ENDPOINT="/api/cron/evening"
          fi
          curl -fsSL -H "Authorization: Bearer ${CRON_SECRET}" "${BOT_BASE_URL}${ENDPOINT}"
