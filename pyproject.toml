[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-alert-bot"
version = "0.1.0"
description = "IDX Stock Direction Sentiment, Walk-Forward Backtest & Morning Alert Telegram Bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4.0",
    "aiohttp>=3.9.0",
    "lxml>=5.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
