[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-cash-radar"
version = "0.1.0"
description = "Audit-Ready XBRL Financial Data Pipeline & Deterministic Liquidity Profiling for IDX Construction Sector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Yehezkiel David Setiawan", email = "author@example.com" }
]
dependencies = [
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "aiogram>=3.4.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pg8000>=1.30.0",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "httpx>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

